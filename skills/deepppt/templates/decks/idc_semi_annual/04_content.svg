</g>
<g id="shape-5" data-name="TextBox 4">
<rect x="49.95" y="477.8" width="672.08" height="190.64" fill="none" stroke="#FFFFFF"/>
<text x="59.55" y="498.47" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">• </tspan><tspan fill="#000000" font-size="18.67">Worldwide revenue for the SDC market was $5.0 billion with a growth </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">of 9.5% in 2024H1. In 2023, modern systems (CSS+CIS) accounted for </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">55% of the SDC market. This shift over time clearly indicates a trend </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">toward more agile infrastructure and cloud operating models.</tspan></text>
<text x="59.55" y="588.07" text-anchor="start" xml:space="preserve" font-family="sans-serif" font-size="18.67" fill="#000000"><tspan fill="#000000" font-size="18.67">• </tspan><tspan fill="#000000" font-size="18.67">The lackluster growth of the worldwide</tspan><tspan fill="#000000" font-size="18.67"> </tspan><tspan fill="#000000" font-size="18.67">economy hurt the software </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">market. Most regions including PRC were impacted by economic </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">instability, inflation, supply chain disruption, and global conflict, </tspan><tspan x="59.55" dy="22.4" fill="#000000" font-size="18.67">making the growth lower than expected.</tspan></text>
</g>
