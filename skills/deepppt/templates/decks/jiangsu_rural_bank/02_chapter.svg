<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="chapterBlueGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004D99"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>

  <!-- Left blue panel -->
  <rect x="0" y="0" width="360" height="540" fill="url(#chapterBlueGrad)"/>

  <!-- Chapter number -->
  <g id="chapter-num-group">
    <text x="180" y="230" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="120" font-weight="bold" fill="#FFFFFF" fill-opacity="0.30">
      {{CHAPTER_NUM}}
    </text>
    <text x="180" y="270" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">
      {{CHAPTER_NUM}}
    </text>
  </g>

  <!-- Chapter title -->
  <g id="chapter-title-group">
    <text x="600" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="36" font-weight="bold" fill="#1A1A1A">
      {{CHAPTER_TITLE}}
    </text>
  </g>

  <!-- Decorative accent line under title -->
  <line x1="480" y1="300" x2="720" y2="300" stroke="#0066CC" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom thin line -->
  <rect x="360" y="532" width="600" height="2" fill="#0066CC" fill-opacity="0.20"/>
</svg>
