<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="coverBlueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#004D99"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>

  <!-- Top blue band -->
  <rect x="0" y="0" width="960" height="8" fill="#0066CC"/>

  <!-- Decorative: blue geometric shapes -->
  <g id="cover-decorations">
    <circle cx="830" cy="80" r="120" fill="#0066CC" fill-opacity="0.06"/>
    <circle cx="830" cy="80" r="70" fill="#0066CC" fill-opacity="0.10"/>
    <rect x="0" y="440" width="320" height="100" fill="#0066CC" fill-opacity="0.04"/>
    <rect x="750" y="460" width="210" height="80" fill="#E94E1B" fill-opacity="0.04"/>
  </g>

  <!-- Main title group -->
  <g id="cover-title-group">
    <text x="480" y="200" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="bold" fill="#1A1A1A">
      {{TITLE}}
    </text>
  </g>

  <!-- Subtitle -->
  <g id="cover-subtitle-group">
    <text x="480" y="260" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" fill="#666666">
      {{SUBTITLE}}
    </text>
  </g>

  <!-- Divider line -->
  <line x1="380" y1="295" x2="580" y2="295" stroke="#0066CC" stroke-width="2" stroke-linecap="round"/>

  <!-- Date & Author -->
  <g id="cover-meta-group">
    <text x="480" y="345" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#666666">
      {{DATE}}
    </text>
    <text x="480" y="375" text-anchor="middle" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#666666">
      {{AUTHOR}}
    </text>
  </g>

  <!-- Bottom decorative bar -->
  <rect x="0" y="532" width="960" height="8" fill="#0066CC"/>
</svg>
