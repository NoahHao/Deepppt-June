    <text x="276" y="522" font-family="微软雅黑, sans-serif" font-size="9" fill="#999" text-anchor="middle">剂量/频次校验</text>

    <rect x="324" y="484" width="72" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2"/>
